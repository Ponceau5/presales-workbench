<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运行日志 · 售前工作台</title>
<style>
:root{color-scheme:light;--bg:#f6f7f4;--surface:#fff;--ink:#203139;--muted:#596969;--line:#dce3df;--accent:#27685e;--error:#b42332}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}header,main{padding:20px 28px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--surface)}h1{font-size:20px;margin:0}a{color:var(--accent)}button,input,select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:16px}label{display:grid;gap:4px}.table{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}table{table-layout:fixed;border-collapse:collapse;width:100%;min-width:1100px;text-align:left}th,td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:500}td{font-variant-numeric:tabular-nums}.failed{color:var(--error)}th:nth-child(1){width:160px}th:nth-child(2){width:150px}th:nth-child(3){width:170px}th:nth-child(4){width:80px}th:nth-child(5){width:95px}th:nth-child(7){width:85px}td:nth-child(3){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}td:nth-child(4),td:nth-child(5){white-space:nowrap}.reason{overflow-wrap:anywhere}.pager{display:flex;gap:16px;align-items:center;justify-content:flex-end;margin-top:16px}.empty{text-align:center;padding:48px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);max-width:760px;width:90%;max-height:85vh;overflow:auto;padding:24px}dialog::backdrop{background:#0005}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,monospace}.notice{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;box-shadow:0 5px 18px #0002;z-index:5;max-width:90vw}.notice button{margin-left:16px}#login{padding:40px;text-align:center}#login[hidden],.notice[hidden]{display:none}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#17201f;--surface:#202c2a;--ink:#edf3f0;--muted:#b4c4bd;--line:#40514b;--accent:#83d2bd;--error:#ff9ba4}}@media(max-width:600px){header,main{padding:16px}input{width:145px}header{gap:16px}}
</style>
<header><h1>运行日志</h1><a href="http://127.0.0.1:7101/" target="_blank" rel="noopener">售前工作台</a></header>
<div id="notice" class="notice" role="alert" hidden><span></span><button aria-label="关闭提示">关闭</button></div>
<section id="login" hidden><p id="loginText"></p><a href="http://127.0.0.1:7101/" target="_blank" rel="noopener">打开工作台登录</a><p><button id="reconnect">重新连接</button></p></section>
<main id="content"><form class="filters" id="filters"><label>项目<input name="project" placeholder="项目编号"></label><label>用户<input name="actor" placeholder="账号"></label><label>状态<select name="status"><option value="">全部</option><option value="failed">失败</option><option value="completed">完成</option><option value="running">执行中</option><option value="cancelled">已停止</option></select></label><button>查询</button><button type="button" id="refresh">刷新</button></form><div class="table"><table><thead><tr><th>时间</th><th>项目 / 工作区</th><th>用户</th><th>状态</th><th>耗时</th><th>原因</th><th>记录</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><span id="count"></span><button id="prev">上一页</button><button id="next">下一页</button></div></main>
<dialog id="detail"><h2>执行记录</h2><pre></pre><form method="dialog"><button>关闭</button></form></dialog>
<script>
const $=s=>document.querySelector(s);let page=1,busy=false;const names={failed:'失败',completed:'完成',running:'执行中',cancelled:'已停止',interrupted:'已中断'};
function notice(text){$('#notice span').textContent=text;$('#notice').hidden=false}$('#notice button').onclick=()=>$('#notice').hidden=true;
async function load(){if(busy)return;busy=true;$('#refresh').disabled=true;try{const query=new URLSearchParams(new FormData($('#filters')));query.set('page',page);const r=await fetch('/api/logs?'+query);const data=await r.json();if(!r.ok){if([401,403].includes(r.status)){$('#login').hidden=false;$('#content').hidden=true;$('#loginText').textContent=data.detail}else notice(data.detail||'读取日志失败');return}$('#login').hidden=true;$('#content').hidden=false;$('#rows').replaceChildren();for(const row of data.rows){const tr=document.createElement('tr');const values=[new Date(row.created_at).toLocaleString('zh-CN'),row.project_id+' / '+row.stage_id,row.actor,names[row.status]||row.status,Number(row.total_seconds).toFixed(2)+' 秒',row.diagnosis||'—'];values.forEach((text,i)=>{const td=document.createElement('td');td.textContent=text;td.title=text;if(i===5)td.className='reason';if(i===3&&row.status==='failed')td.className='failed';tr.append(td)});const td=document.createElement('td'),button=document.createElement('button');button.textContent='详情';button.onclick=()=>{$('#detail pre').textContent=JSON.stringify({记录编号:row.id,时间:row.created_at,项目:row.project_id,工作区:row.stage_id,用户:row.actor,状态:names[row.status]||row.status,原因:row.diagnosis,供应商状态码:row.http_status,排查明细:row.details},null,2);$('#detail').showModal()};td.append(button);tr.append(td);$('#rows').append(tr)}if(!data.rows.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=7;td.className='empty';td.textContent='暂无记录';tr.append(td);$('#rows').append(tr)}$('#count').textContent=`共 ${data.total} 条 · 第 ${page} 页`;$('#prev').disabled=page===1;$('#next').disabled=page*30>=data.total}catch{notice('日志服务连接失败，请检查 7102 服务后刷新')}finally{busy=false;$('#refresh').disabled=false}}
$('#filters').onsubmit=e=>{e.preventDefault();page=1;load()};$('#refresh').onclick=load;$('#reconnect').onclick=load;$('#prev').onclick=()=>{page--;load()};$('#next').onclick=()=>{page++;load()};load();
</script></html>
