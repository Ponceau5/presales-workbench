server {
 listen 80 default_server;
 server_name 8.130.81.157;
 root /opt/salesworkbench/web;
 client_max_body_size 100m;
 gzip on;
 gzip_types text/css application/javascript application/json;
 location /api/ {
  proxy_pass http://127.0.0.1:8000;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_read_timeout 600s;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 }
 location /project-data/ { proxy_pass http://127.0.0.1:8000/api/source-assets/project-data/; }
 location /shared/ { proxy_pass http://127.0.0.1:8000/api/source-assets/shared/; }
 location /assets/ { expires 7d; try_files $uri =404; }
 location / { add_header Cache-Control "no-cache" always; try_files $uri $uri/ /index.html; }
}
