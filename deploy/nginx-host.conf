server {
 listen 80 default_server;
 server_name 8.130.81.157;
 root /opt/salesworkbench/web;
 client_max_body_size 100m;
 gzip on;
 gzip_types text/css application/javascript application/json;
 # Casdoor shares the existing public origin; its listener remains loopback-only.
 location /.well-known/ { proxy_pass http://127.0.0.1:9090; proxy_set_header Host $host; }
 location ~ ^/(login|signup|forget|reset-password)(/|$) { proxy_pass http://127.0.0.1:9090; proxy_set_header Host $host; }
 location ~ ^/api/(login|logout|signup|userinfo|token|device|verify|captcha|send|check|reset|forget|mfa|face|webauthn|saml|cas|oidc|get-|add-|update-|delete-|set-|upload-|resource|download) {
  proxy_pass http://127.0.0.1:9090;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 }
 location /api/ {
  proxy_pass http://127.0.0.1:8000;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_read_timeout 600s;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 }
 location /project-data/ { proxy_pass http://127.0.0.1:8000/api/source-assets/project-data/; }
 location /shared/ { proxy_pass http://127.0.0.1:8000/api/source-assets/shared/; }
 location /assets/ { expires 7d; try_files $uri @identity_asset; }
 location @identity_asset { proxy_pass http://127.0.0.1:9090; proxy_set_header Host $host; }
 location = /ProviderHintRedirect.js { proxy_pass http://127.0.0.1:9090; }
 location = /AuthCallbackHandler.js { proxy_pass http://127.0.0.1:9090; }
 location / { add_header Cache-Control "no-cache" always; try_files $uri $uri/ /index.html; }
}
